services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  accounts:
    build:
      context: ../..
      dockerfile: services/accounts/Dockerfile
    environment:
      ENV: dev
      LOG_LEVEL: debug
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://accounts:accounts@db:5432/accounts?sslmode=disable
    depends_on:
      - db
    ports:
      - "8080:8080"
