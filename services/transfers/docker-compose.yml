services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: transfers
      POSTGRES_PASSWORD: transfers
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
  transfers:
    build:
      context: ../..
      dockerfile: services/transfers/Dockerfile
    environment:
      ENV: dev
      LOG_LEVEL: debug
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://transfers:transfers@db:5432/transfers?sslmode=disable
      REDIS_ADDR: redis:6379
      ACCOUNTS_URL: http://host.docker.internal:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8081:8081"
    restart: on-failure
