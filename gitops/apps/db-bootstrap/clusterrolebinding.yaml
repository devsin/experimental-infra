apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: db-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
- kind: ServiceAccount
  name: db-bootstrap
  namespace: db
roleRef:
  kind: ClusterRole
  name: db-bootstrap
  apiGroup: rbac.authorization.k8s.io
