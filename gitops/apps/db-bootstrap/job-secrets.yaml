apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-db-secrets
  namespace: db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: db-bootstrap
      restartPolicy: Never
      containers:
      - name: seed-secrets
        image: bitnami/kubectl:latest
        command:
        - sh
        - -c
        - |
          set -euo pipefail
          ACC_NS=apps
          DB_NS=db

          gen_pw() {
            # 32 URL-safe chars (alnum) to avoid breaking DATABASE_URL
            tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32
          }

          ensure_secret() {
            local ns=$1 name=$2 user=$3 pass=$4 db=$5
            if kubectl -n "$ns" get secret "$name" >/dev/null 2>&1; then
              echo "secret $ns/$name exists, skipping"
              return 0
            fi
            kubectl -n "$ns" create secret generic "$name" \
              --from-literal=DB_USER="$user" \
              --from-literal=DB_PASSWORD="$pass" \
              --from-literal=DB_NAME="$db" \
              --from-literal=DATABASE_URL="postgres://${user}:${pass}@postgres-postgresql.db:5432/${db}?sslmode=disable"
            echo "created secret $ns/$name"
          }

          # accounts creds (shared between app ns and db ns)
          if kubectl -n "$ACC_NS" get secret accounts-db-password >/dev/null 2>&1; then
            ACC_PASS=$(kubectl -n "$ACC_NS" get secret accounts-db-password -o jsonpath='{.data.password}' | base64 -d)
          else
            ACC_PASS=$(gen_pw)
            kubectl -n "$ACC_NS" create secret generic accounts-db-password --from-literal=password="$ACC_PASS"
          fi
          ensure_secret "$ACC_NS" accounts-db accounts "$ACC_PASS" accounts
          ensure_secret "$DB_NS" accounts-db accounts "$ACC_PASS" accounts

          # transfers creds (shared between app ns and db ns)
          if kubectl -n "$ACC_NS" get secret transfers-db-password >/dev/null 2>&1; then
            TR_PASS=$(kubectl -n "$ACC_NS" get secret transfers-db-password -o jsonpath='{.data.password}' | base64 -d)
          else
            TR_PASS=$(gen_pw)
            kubectl -n "$ACC_NS" create secret generic transfers-db-password --from-literal=password="$TR_PASS"
          fi
          ensure_secret "$ACC_NS" transfers-db transfers "$TR_PASS" transfers
          ensure_secret "$DB_NS" transfers-db transfers "$TR_PASS" transfers

          # redis password (mirror redis secret into apps namespace for transfers service)
          if kubectl -n "$ACC_NS" get secret redis >/dev/null 2>&1; then
            echo "secret $ACC_NS/redis exists, skipping"
          else
            REDIS_PASS=$(kubectl -n "$DB_NS" get secret redis -o jsonpath='{.data.redis-password}' | base64 -d)
            kubectl -n "$ACC_NS" create secret generic redis --from-literal=redis-password="$REDIS_PASS"
            echo "created secret $ACC_NS/redis"
          fi

          echo "all secrets ensured"
