apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfers
  namespace: apps
  labels:
    app: transfers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transfers
  template:
    metadata:
      labels:
        app: transfers
    spec:
      containers:
      - name: transfers
        image: transfers
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENV
          value: dev
        - name: LOG_LEVEL
          value: info
        - name: HTTP_ADDR
          value: ":8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: transfers-db
              key: DATABASE_URL
        - name: REDIS_ADDR
          value: "redis-master.db:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis
              key: redis-password
        - name: ACCOUNTS_URL
          value: "http://accounts.apps.svc.cluster.local:8080"
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: transfers-pdb
  namespace: apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: transfers
