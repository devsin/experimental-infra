apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  namespace: apps
  labels:
    app: accounts
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      containers:
      - name: accounts
        image: accounts
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENV
          value: dev
        - name: LOG_LEVEL
          value: info
        - name: HTTP_ADDR
          value: ":8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: accounts-db
              key: DATABASE_URL
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: accounts-pdb
  namespace: apps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: accounts
