name: Build and push namespaceguard controller

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  GCP_REGISTRY: "europe-west2-docker.pkg.dev/cyberark-gitops-c322b4/cyberark-images-c322b4"
  CONTROLLER_NAME: "namespaceguard"
  CONTROLLER_DIR: "controller/namespaceguard"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      namespaceguard: ${{ steps.filter.outputs.namespaceguard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            namespaceguard:
              - 'controller/namespaceguard/**'
              - '.github/workflows/build-and-push-namespaceguard.yaml'

  build-and-push:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.namespaceguard == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: |
          REGISTRY_HOST=$(echo "${GCP_REGISTRY}" | cut -d/ -f1)
          gcloud auth configure-docker "$REGISTRY_HOST" -q

      # Buildx is needed for multi-arch images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional but recommended: enable caching for faster builds
      - name: Docker buildx cache
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push multi-arch image
        working-directory: ${{ env.CONTROLLER_DIR }}
        env:
          IMAGE_SHA: ${{ env.GCP_REGISTRY }}/${{ env.CONTROLLER_NAME }}:${{ github.sha }}
          IMAGE_LATEST: ${{ env.GCP_REGISTRY }}/${{ env.CONTROLLER_NAME }}:latest
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE_SHA}" \
            -t "${IMAGE_LATEST}" \
            --push \
            .
